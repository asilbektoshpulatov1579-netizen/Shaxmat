var mW=new THREE.MeshStandardMaterial({color:0xf2ead8,roughness:.45}),mB=new THREE.MeshStandardMaterial({color:0x2b2b30,roughness:.45});
function lathe(pts){return new THREE.LatheGeometry(pts.map(function(p){return new THREE.Vector2(p[0],p[1])}),20)}
function sph(rad,y,mat){var s=new THREE.Mesh(new THREE.SphereGeometry(rad,16,12),mat);s.position.y=y;return s}
function box(w,h,d,x,y,z,mat){var s=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);s.position.set(x,y,z);return s}
function makePiece(t,white){
  var mat=white?mW:mB,g=new THREE.Group(),L=function(p){g.add(new THREE.Mesh(lathe(p),mat))};
  if(t==='p'){L([[0,0],[.3,0],[.3,.07],[.16,.2],[.12,.4],[.2,.45],[0,.45]]);g.add(sph(.16,.58,mat))}
  else if(t==='r'){L([[0,0],[.34,0],[.34,.08],[.22,.2],[.22,.55],[.32,.6],[.32,.8],[0,.8]])}
  else if(t==='b'){L([[0,0],[.32,0],[.32,.08],[.15,.25],[.12,.6],[.2,.65],[0,.65]]);g.add(sph(.17,.82,mat))}
  else if(t==='q'){L([[0,0],[.34,0],[.34,.08],[.18,.3],[.14,.8],[.3,.95],[0,.95]]);g.add(sph(.13,1.1,mat))}
  else if(t==='k'){L([[0,0],[.34,0],[.34,.08],[.18,.3],[.14,.85],[.28,1],[0,1]]);g.add(box(.1,.4,.1,0,1.2,0,mat),box(.3,.1,.1,0,1.25,0,mat))}
  else{L([[0,0],[.34,0],[.34,.08],[.2,.2],[0,.2]]);g.add(box(.3,.5,.3,0,.45,0,mat));var h=box(.24,.22,.5,0,.8,-.14,mat);h.rotation.x=.4;g.add(h)}
  if(!white&&t==='n')g.rotation.y=Math.PI;
  return g;
}
function sync(){
  ren.shadowMap.needsUpdate=true;while(pcG.children.length)pcG.remove(pcG.children[0]);
  for(var i=0;i<64;i++){
    var p=B[i];if(p===' ')continue;
    var g=makePiece(p.toLowerCase(),isW(p));
    g.position.set((i&7)-3.5,.1,(i>>3)-3.5);
    g.traverse(function(o){o.castShadow=true});g.userData.sq=i;pcG.add(g);
  }
  highlight();
}
function highlight(){
  sqs.forEach(function(s){s.material.color.setHex(s.userData.col)});
  while(mkG.children.length)mkG.remove(mkG.children[0]);
  if(sel===null)return;
  sqs[sel].material.color.setHex(0xe0a100);
  legalCache.forEach(function(m){
    if(m[0]!==sel)return;
    var cap=B[m[1]]!==' ',mk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.05,20),
      new THREE.MeshStandardMaterial({color:cap?0xd9342b:0x3fae49}));
    mk.position.set((m[1]&7)-3.5,.13,(m[1]>>3)-3.5);mkG.add(mk);
  });
}
/* ---------- game flow ---------- */
function init(){
  B=START.split('');turn='w';sel=null;over=false;
  legalCache=legal(B,'w');sync();$st.textContent='Sizning navbatingiz';
}
function after(side){
  var ms=legal(B,side),chk=inCheck(B,side);
  if(!ms.length){
    over=true;
    $st.textContent=chk?(side==='b'?'Mat! Siz yutdingiz 🎉':'Mat! Siz yutqazdingiz 😕'):'Durang (pat)';
    return false;
  }
  legalCache=ms;
  $st.textContent=side==='w'?(chk?'Shoh! Sizning navbatingiz':'Sizning navbatingiz'):'Kompyuter o‘ylayapti…';
  return true;
}
function pick(i){
  if(over||turn!=='w')return;
  var m=sel!==null&&legalCache.filter(function(m){return m[0]===sel&&m[1]===i})[0];
  if(m){
    B=doMove(B,m);sel=null;turn='b';legalCache=[];sync();
    if(after('b'))setTimeout(function(){
      B=doMove(B,aiMove());turn='w';sel=null;sync();after('w');sync();
    },500);
    return;
  }
  var p=B[i];
  sel=(p!==' '&&isW(p)&&legalCache.some(function(m){return m[0]===i}))?i:null;
  highlight();
}
document.getElementById('rs').onclick=init;
var diff='mid',inLobby=true,toFront=false;
document.body.classList.add('lobby');
function startGame(){
 inLobby=false;bust.visible=false;document.body.classList.remove('lobby');document.getElementById('lobby').style.display='none';
 th=((th+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;toFront=true;
 init();hg.fl=-1;hg.t0=performance.now()/1000;
}
function showLobby(){inLobby=true;bust.visible=true;toFront=false;document.body.classList.add('lobby');document.getElementById('lobby').style.display='flex'}
document.getElementById('go').onclick=startGame;
document.getElementById('mn').onclick=showLobby;
document.querySelectorAll('.df').forEach(function(b){b.onclick=function(){diff=b.dataset.d;document.querySelectorAll('.df').forEach(function(x){x.classList.toggle('on',x===b)})}});
/* ---------- camera & input ---------- */
var th=0,ph=1.0,rad=13,ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function place(){
  cam.position.set(rad*Math.sin(ph)*Math.sin(th),rad*Math.cos(ph),rad*Math.sin(ph)*Math.cos(th));
  cam.lookAt(0,0,0);
}
function resize(){
  var w=innerWidth,h=innerHeight;ren.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();
  rad=w<h?16:13;place();placeBust();
}
addEventListener('resize',resize);
var down=null,last=null;
var cv=ren.domElement;
cv.addEventListener('pointerdown',function(e){toFront=false;down={x:e.clientX,y:e.clientY};last={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointermove',function(e){
  if(!last)return;
  th-=(e.clientX-last.x)*.008;
  ph=Math.max(.25,Math.min(1.45,ph-(e.clientY-last.y)*.008));
  last={x:e.clientX,y:e.clientY};place();
});
cv.addEventListener('pointerup',function(e){
  last=null;
  if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>6)return;
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse,cam);
  var hits=ray.intersectObjects([pcG,sqG],true);
  for(var k=0;k<hits.length;k++){
    var o=hits[k].object;
    while(o&&o.userData.sq===undefined)o=o.parent;
    if(o){pick(o.userData.sq);break}
  }
});
cv.addEventListener('wheel',function(e){e.preventDefault();rad=Math.max(7,Math.min(22,rad+e.deltaY*.01));place()},{passive:false});
(function loop(){
 requestAnimationFrame(loop);var t=performance.now()/1000;
 flames.forEach(function(f,q){f.scale.set(1,1.4+Math.sin(t*9+q*2)*.25,1)});
 gems.forEach(function(g,q){g.position.y=1.2+Math.sin(t*1.5+q)*.3;g.rotation.y=t*.8});
 for(var q=0;q<pn;q++){pa[q*3+1]+=.006;if(pa[q*3+1]>8)pa[q*3+1]=0}
 pg.attributes.position.needsUpdate=true;dust.rotation.y=t*.03;hgUpdate(t);if(inLobby){th+=.003;place()}else if(toFront){th*=.92;if(Math.abs(th)<.01){th=0;toFront=false}place()}
 bust.rotation.y=.3+Math.sin(t*.6)*.12;players.forEach(function(p,q){p.head.rotation.y=Math.sin(t*.5+q*2)*.25;p.head.rotation.x=Math.sin(t*.8+q)*.05});
 ren.render(scene,cam);
})();
buildBust();resize();init();
</script>
